name: Android CI (Java 21)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"

      - name: Accept licenses & install basic packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "cmdline-tools;latest" "platforms;android-36" || true

      - name: Setup Gradle cache/action
        uses: gradle/actions/setup-gradle@v4

      - name: Neutralize org.gradle.java.home from repo
        run: |
          # Proje içindeki Windows yolunu temizle (varsa)
          if [ -f gradle.properties ]; then
            sed -i '/^org\.gradle\.java\.home=/d' gradle.properties || true
          fi
          # Gradle'a çalışacağı JDK 21'i açıkça bildir
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV

      - name: Print versions
        run: |
          ./gradlew --version
          java -version

      - name: Assemble (optional)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Tests + coverage (JaCoCo)
        run: ./gradlew --no-daemon :app:testDebugUnitTest jacocoTestReportAll

      - name: Upload unit test report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html
          path: app/build/reports/jacoco/jacocoTestReportAll/html

      - name: Upload coverage report (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: app/build/reports/jacoco/jacocoTestReportAll/jacocoTestReportAll.xml
